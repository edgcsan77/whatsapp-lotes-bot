{% extends "panel/base.html" %}

{% block content %}
<div class="login-wrapper">
    <div class="card login-card">
        <h1>Panel administrativo</h1>

        <p class="muted">
            Ingresa para administrar clientes y configuración.
        </p>

        {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/panel/login">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            >

            <div class="field">
                <label for="username">Usuario</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="field">
                <label for="password">Contraseña</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">
                Iniciar sesión
            </button>
        </form>
    </div>
</div>
{% endblock %}
